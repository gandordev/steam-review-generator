<aside class="preview-panel" aria-labelledby="txtPreviewTitle">
  <div class="preview-header">
    <h2 id="txtPreviewTitle"></h2>
  </div>
  <label class="visually-hidden" for="outputPreview" id="previewLabel"></label>
  <textarea class="preview-box" id="outputPreview" readonly></textarea>
  <div class="action-buttons">
    <button class="button button-green" id="copyBtn" type="button"></button>
    <button class="button button-reset" id="resetBtn" type="button"></button>
  </div>
  <p class="action-status" id="actionStatus" role="status" aria-live="polite"></p>
</aside>
