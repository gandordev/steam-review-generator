<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create and copy formatted BBCode reviews for Steam games."
    />
    <title>Steam Review Generator</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/category-card.css" />
    <link rel="stylesheet" href="css/components/add-category.css" />
    <link rel="stylesheet" href="css/components/review-notes.css" />
    <link rel="stylesheet" href="css/components/review-preview.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Steam Review Generator</h1>
      <nav class="language-selector" aria-label="Language">
        <button class="language-button" id="langEs" type="button" lang="es">ES</button>
        <button class="language-button" id="langEn" type="button" lang="en">EN</button>
      </nav>
    </header>

    <main class="app-layout">
      <div class="left-column">
        <section
          class="categories-grid"
          id="categoriesContainer"
          aria-label="Review categories"
        ></section>
        <div id="addCategoryMount"></div>
        <div id="reviewNotesMount"></div>
      </div>
      <div id="reviewPreviewMount"></div>
    </main>

    <p class="app-error" id="appError" role="alert" hidden></p>
  </body>
</html>
